<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeyGo UI</title>
    <!-- Theme init: run synchronously before paint to avoid flash -->
    <script>
      (function () {
        var debugLocale = window.location.search.indexOf('debug-locale=1') >= 0

        try {
          var supportedLocales = ['es-CL', 'en-US']
          var localeStorageKey = 'keygo-locale'
          var localeSourceStorageKey = 'keygo-locale-source'
          var manualLocaleSource = 'manual'
          var safeStorageGet = function (key) {
            try {
              return localStorage.getItem(key)
            } catch (_error) {
              return null
            }
          }
          var safeStorageRemove = function (key) {
            try {
              localStorage.removeItem(key)
            } catch (_error) {}
          }
          var normalizeLocale = function (value) {
            if (!value || typeof value !== 'string') return 'es-CL'
            var normalized = value.trim()
            if (supportedLocales.indexOf(normalized) >= 0) return normalized
            var lower = normalized.toLowerCase()
            if (lower.startsWith('es')) return 'es-CL'
            if (lower.startsWith('en')) return 'en-US'
            return 'es-CL'
          }

          var persistedLocale = safeStorageGet(localeStorageKey)
          var persistedLocaleSource = safeStorageGet(localeSourceStorageKey)
          if (persistedLocaleSource !== manualLocaleSource) {
            persistedLocale = null
            safeStorageRemove(localeStorageKey)
            safeStorageRemove(localeSourceStorageKey)
          }
          var browserLocale = (navigator.languages && navigator.languages[0]) || navigator.language || 'es-CL'
          var resolvedLocale = normalizeLocale(persistedLocale || browserLocale)
          document.documentElement.lang = resolvedLocale

          window.__kgLocaleDebug = {
            supportedLocales: supportedLocales.slice(),
            persistedLocale: persistedLocale,
            persistedLocaleSource: persistedLocaleSource,
            navigatorLanguages: navigator.languages ? Array.prototype.slice.call(navigator.languages) : [],
            navigatorLanguage: navigator.language || null,
            browserLocale: browserLocale,
            resolvedLocale: resolvedLocale,
          }

          if (debugLocale) {
            console.info('[keygo-locale-bootstrap]', window.__kgLocaleDebug)
          }

          var p = localStorage.getItem('keygo-theme') || 'system'
          var highContrast = p === 'high-contrast'
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (highContrast) {
            document.documentElement.classList.add('high-contrast')
            document.documentElement.classList.add('dark')
            return
          }
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          if (debugLocale) {
            console.error('[keygo-locale-bootstrap:error]', e)
          }
        }
      })()
    </script>
    <style>
      #kg-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(251, 191, 36, 0.2), transparent 60%),
          linear-gradient(180deg, #0f172a, #020617);
        color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      }
      #kg-boot .wrap {
        width: min(92vw, 560px);
        padding: 1.5rem;
        /* Remove initial border to avoid visible white edge on some browsers */
        border: none;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      /* Ensure no white background shows around rounded elements before app loads */
      html, body {
        background: #020617;
        margin: 0;
        height: 100%;
      }
      #kg-boot .row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }
      #kg-boot .spinner {
        width: 2.35rem;
        height: 2.35rem;
        border-radius: 9999px;
        border: 3px solid rgba(251, 191, 36, 0.2);
        border-top-color: rgba(252, 211, 77, 0.95);
        animation: kg-spin 0.9s linear infinite;
        flex-shrink: 0;
      }
      #kg-boot h1 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.3;
      }
      #kg-boot p {
        margin: 0.25rem 0 0;
        font-size: 0.875rem;
        color: #cbd5e1;
      }
      @keyframes kg-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="kg-boot" role="status" aria-live="polite" aria-atomic="true">
        <div class="wrap">
          <div class="row">
            <span class="spinner" aria-hidden="true"></span>
            <div>
              <h1>Loading KeyGo</h1>
              <p>We are starting the application. This may take a few seconds.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
